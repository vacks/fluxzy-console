name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        id: version
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" >&2
            exit 1
          }
          echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read bundled CLI release
        id: fluxzy
        run: |
          . fork/fluxzy/upstream.env
          echo "release=${FLUXZY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Go tests
        run: |
          mkdir -p web/dist
          printf '<!doctype html><title>fluxzy-console</title>' > web/dist/index.html
          go test ./...

      - name: Build patched fluxzy CLI (linux amd64)
        run: ./fork/fluxzy/build.sh amd64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: prod-amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONSOLE_VERSION=${{ steps.version.outputs.value }}
            FLUXZY_CLI_RELEASE=${{ steps.fluxzy.outputs.release }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "fluxzy-console ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
